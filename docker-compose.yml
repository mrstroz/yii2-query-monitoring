services:
  php:
    build:
      context: docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.1}
    image: yii2-query-monitoring-php:${PHP_VERSION:-8.1}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - composer-cache:/tmp/composer/cache
    working_dir: /app
    environment:
      QM_MYSQL_DSN: "mysql:host=mysql;dbname=qm"
      QM_MYSQL_USER: qm
      QM_MYSQL_PASSWORD: qm
      QM_PGSQL_DSN: "pgsql:host=pgsql;dbname=qm"
      QM_PGSQL_USER: qm
      QM_PGSQL_PASSWORD: qm
      QM_MONGODB_DSN: "mongodb://mongodb:27017/qm"
    depends_on:
      mysql:
        condition: service_healthy
      pgsql:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: qm
      MYSQL_USER: qm
      MYSQL_PASSWORD: qm
      MYSQL_ROOT_PASSWORD: qm
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uqm", "-pqm"]
      interval: 2s
      timeout: 5s
      retries: 60

  pgsql:
    image: postgres:16
    environment:
      POSTGRES_DB: qm
      POSTGRES_USER: qm
      POSTGRES_PASSWORD: qm
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "qm", "-d", "qm"]
      interval: 2s
      timeout: 5s
      retries: 60

  mongodb:
    image: mongo:7
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping: 1}).ok"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  composer-cache:
